[package]
name = "sapient-test-harness-cli"
description = "CLI for the independent SAPIENT / BSI Flex 335 conformance test harness"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "sapient_test_harness_cli"
path = "src/lib.rs"

[[bin]]
name = "sapient-harness"
path = "src/main.rs"

[package.metadata.dist]
include = ["../../RULES.md", "../../QUICKSTART.md", "../../examples"]

[dependencies]
sapient-conformance-core.workspace = true
sapient-session.workspace = true
prost.workspace = true
prost-types.workspace = true
prost-reflect = { version = "0.14", features = ["serde"] }
tokio.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
ulid.workspace = true
include_dir.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
