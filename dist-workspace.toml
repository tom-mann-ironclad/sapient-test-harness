[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "aarch64-pc-windows-msvc", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false
# Supply-chain metadata for each release: binaries built with their dependency
# list embedded (readable by `cargo audit bin`, Trivy, Syft), a CycloneDX SBOM
# (`sapient-test-harness-cli.cdx.xml`), and GitHub build-provenance
# attestations (`gh attestation verify <file> --repo <owner>/<repo>`).
# release.yml installs the pinned tool versions and generates the SBOM itself;
# see the HAND-ADDED comments there.
cargo-auditable = true
cargo-cyclonedx = true
github-attestations = true
# release.yml has a hand-added `validate` job, `if:` conditions, and SHA-pinned
# `uses:` actions on top of what `dist generate` produces (see the comment at
# the top of that job) -- these are permanent, deliberate drift, not staleness
# to regenerate away, so CI is in the allow-dirty list.
allow-dirty = ["ci"]

[dist.github-custom-runners]
global = "ubuntu-26.04"

# The installer otherwise assumes the build runner's glibc (2.35 on
# ubuntu-22.04) and refuses glibc 2.34 systems such as RHEL/Rocky/Alma 9,
# though the binaries only reference GLIBC_2.34 symbols. Re-check with
# `readelf -V sapient-harness | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1`
# if the build runners or dependencies change.
[dist.min-glibc-version]
x86_64-unknown-linux-gnu = "2.34"
aarch64-unknown-linux-gnu = "2.34"
