[workspace]
resolver = "3"
members = [
    "crates/sapient-conformance-core",
    "crates/sapient-session",
    "crates/sapient-test-harness-cli",
]

[workspace.package]
version = "1.0.0-beta.4"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Tom Mann <tom.mann@ironclad-software.com>"]
repository = "https://github.com/tom-mann-ironclad/sapient-test-harness"

[workspace.dependencies]
sapient-rs = { version = "0.2.0", features = ["v2_0"] }
sapient-conformance-core = { path = "crates/sapient-conformance-core" }
sapient-session = { path = "crates/sapient-session" }
prost = "0.14.3"
prost-types = "0.14.3"
ulid = "1.2.1"
uuid = { version = "1.18.1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
include_dir = "0.7"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
